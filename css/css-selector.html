<html>
    <head>
        <title>CSS Selectors Examples</title>

        <style>
            /*1. element selector*/
            h1{color: red;}
            /*2.class selector*/
            .blueText{
                color: blue;
            }
            /*3.ID selector*/
            #greenText{
                color: green;
            }
            /*4. Group selector*/
            h2,
            p{
                color: purple;
            }
        </style>
    </head>
    <body>
        <h1>This is element selector (h1->red)</h1>

        <h2>This is a group selector (h2->purple)</h2>

        <p>This paragraph is also purple(group selector)</p>

        <p class ="blueText">This uses class selector(blueText-> blue)</p>

        <p id="greenText">this uses the id selector(greenText->green)</p>
    </body>
</html>
