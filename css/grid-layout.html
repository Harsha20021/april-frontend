<html>
    <head>
        <title> CSS Grid</title>
         <style>
            .one{
                height: 400px;
                width: auto;
                background-color: blue;
                border: 2px solid black;
            }
            .two{
                height: 400px;
                width: auto;
                background-color: rgb(0, 38, 12);
                border: 2px solid black;
            }
            .three{
                height: 400px;
                width: auto;
                background-color: rgb(150, 14, 77);
                border: 2px solid black;
            }
            .main{
                display: grid;
                grid-template-columns: 20% 40% 30%;
                column-gap: 20px;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="three">3</div>
        </div>
    </body>
</html>
