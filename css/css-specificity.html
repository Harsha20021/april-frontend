<html>
    <head>
        <title>CSS Specificity</title>
        <style>
            #para{
                color: pink;
            }
            .new{
                color: green;
            }
            p{
                color: brown !important;
            }
        </style>
    </head>
    <body>
        <p id="para" class="new" style="color: red">
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. 
            Porro rem error esse dolore id dignissimos minus iste, asperiores nulla iusto maxime. 
            Iusto quod suscipit soluta minus odit aliquid reiciendis a?
        </p>
    </body>
</html>
