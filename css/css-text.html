<html>
    <head>
        <title>CSS Text Learning</title>
        <style>
            h1{
                color: blue;
                text-decoration-line: underline;
                text-decoration-line: line-through;
                text-decoration-line: underline overline;
                text-decoration-color:red;
                text-decoration-style:dashed ;
                text-decoration-thickness: 5px;
                text-transform: uppercase;
                text-transform: lowercase;
                text-transform: capitalize;
                text-align: center;
            }
            p{
                text-indent: 30px;
                letter-spacing: 5px;
                word-spacing: 20px;
                line-height: 20px;

            }
        </style>
    </head>
    <body>
        <h1>hello world</h1>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. 
           Ipsam rem inventore incidunt earum dolorum nesciunt voluptatibus quo ex pariatur, nulla vitae, hic blanditiis. 
           Dicta autem doloribus fuga, iusto neque dolorem.
        </p>
    </body>
</html>
