<html>
    <head>
        <title>CSS Box</title>
        <style>
            .one{
                height: 300px;
                width: 400px;
                text-align: center;
                border: 2px solid black;
                background-color: aqua;
            }
            .two{
                height: 300px;
                width: 400px;
                text-align: center;
                border: 2px solid black;
                padding: 50px;
                box-sizing: border-box;
                background-color: rgb(129, 201, 13)
            }
        </style>
    </head>
    <body>
        <div class="one">Class One</div>
        <div class="two">Class Two</div>
    </body>
</html>
