<html>
    <head>
        <title>RGB vs RGBA Examples</title>

        <style>
            /*RGB colors*/
            .rgb-red{
                color: rgb(255,0,0);
            }
            .rgb-green{
                color: rgb(0,255,0);
            }
            .rgb-blue{
                color:rgb(0,0,255);
            }   
            /*RGB combined(All colors)*/
            .rgb-all{
                color: rgb(255,165,0);/*orange(mix of red + green)*/
            }
            /*RGBA colors*/
            .rgba-red{
                color: rgba(255,0,0,0.5);
            }
            .rgba-green{
                color: rgba(0,255,0,0.3);
            }
            .rgba-blue{
                color: rgba(0,0,255,0.7);
            }
            /*RGBA combined (All color with tranparency)*/
            .rgba-all{
                color: rgba(255,165,0,0); /*transparent*/
            }
        </style>
    </head>
    <body>
        <h2 class="rgb-red">RGB RED</h2>
        <h2 class="rgb-green">RGB GREEN</h2>
        <h2 class="rgb-blue">RGB BLUE</h2>
        <h2 class="rgb-all">RGB combined(orange - no tranparency)</h2>

        <h2 class="rgba-red">RGBA RED</h2>
        <h2 class="rgba-green">RGBA GREEN</h2>
        <h2 class="rgba-blue">RGBA BLUE</h2>
        <h2 class="rgba-all">RGBA combined(orange with tranparency</h2>
    </body>
</html>
